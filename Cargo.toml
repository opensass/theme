[package]
name = "theme"
version = "0.0.3"
edition = "2024"
rust-version = "1.89"
description = "🎨 A highly customizable theming system for WASM frameworks like Yew, Dioxus, and Leptos."
license = "MIT"
keywords = ["theme", "yew", "rust", "dioxus", "leptos"]
categories = ["web-programming", "science"]
repository = "https://github.com/opensass/theme"
homepage = "https://kit.opensass.org"
documentation = "https://docs.rs/theme"
authors = ["Mahmoud Harmouch <oss@wiseai.dev>"]
exclude = ["/assets", "/examples"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
yew = { version = "0.23.0", default-features = false, optional = true }
dioxus = { version = "0.7.10", optional = true }
leptos = { version = "0.8.23", optional = true }
web-sys = { version = "0.3.107", features = [
    "Document",
    "Window",
    "Storage",
    "HtmlHeadElement",
    "StorageEvent",
    "MediaQueryList",
]}
serde = { version = "1.0.229", features = ["derive", "rc"] }

[features]
yew = ["dep:yew"]
dio = ["dioxus"]
lep = ["leptos"]

[profile.release]
opt-level = "z"
debug = false
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[badges]
maintenance = { status = "actively-developed" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
log = "0.4.28"
bump2version = "0.2.3"
