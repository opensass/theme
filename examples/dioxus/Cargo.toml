[package]
name = "theme-dioxus-example"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
theme = { path = "../../", features = ["dio"] }
dioxus-logger = "0.7.10"
maplit = "1.0.2"
table-rs = { version = "0.1.0", features = ["dio"] }

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
